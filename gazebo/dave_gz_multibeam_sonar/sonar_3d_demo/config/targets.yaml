# Scene + target manifest for tank_scene.launch.py.
#
# This file is the single source of truth for the float pose, sonar pose,
# and every target's pose. Edit the numbers here; the world file
# (tank_with_float.world) only holds the tank, lights, and GUI plugins.
#
# All poses are 6-DOF (x, y, z, roll, pitch, yaw) in metres / radians,
# expressed in the Gazebo world frame.
#
# CLI overrides on the target (x, y, z, roll, pitch, yaw, target) take
# precedence over the value here. The sonar and float poses are not
# overridable from the CLI — change them in this YAML.

